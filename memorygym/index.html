<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super-Power Memory Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a training map down the left (one "tip" per stop, level pips), the active drill on the right; stacks on phones. */
:root{
  --bg:#ECEFF6; --surface:#FFFFFF; --ink:#181D35; --muted:#596080; --line:#D3D8E6; --chip:#E1E6F4;
  --accent:#3447D1; --accent-ink:#FFFFFF; --gold:#C98A00; --good:#1C8456; --bad:#BF3B35;
  --good-bg:#DFF3E9; --bad-bg:#F8E2E0;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10121B; --surface:#191C2A; --ink:#E7E9F4; --muted:#9BA1BD; --line:#2B3046; --chip:#242941;
  --accent:#8E9CFF; --accent-ink:#0F1220; --gold:#F2B930; --good:#4CC38A; --bad:#F0726A;
  --good-bg:#173528; --bad-bg:#3A1D1C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10121B; --surface:#191C2A; --ink:#E7E9F4; --muted:#9BA1BD; --line:#2B3046; --chip:#242941;
  --accent:#8E9CFF; --accent-ink:#0F1220; --gold:#F2B930; --good:#4CC38A; --bad:#F0726A;
  --good-bg:#173528; --bad-bg:#3A1D1C; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.skill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:84px}
.stat b{display:block;font-family:var(--mono);font-size:18px}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;margin-top:20px}
@media (max-width:860px){.app{grid-template-columns:1fr}}
.map{display:flex;flex-direction:column;gap:6px}
.map-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.map-h label{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px}
.skill{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--ink)}
.skill:hover{background:var(--surface);border-color:var(--line)}
.skill.on{background:var(--surface);border-color:var(--accent)}
.skill.locked{opacity:.5}
.skill .n{font-family:var(--mono);font-weight:700;font-size:13px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.skill.done .n{background:var(--good);color:var(--surface)}
.skill .t{font-weight:700;font-size:15px;line-height:1.25}
.skill .c{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:4px}
.pip{width:18px;height:5px;border-radius:3px;background:var(--line)}
.pip.s1{background:color-mix(in srgb,var(--gold) 45%,var(--line))}
.pip.s2{background:color-mix(in srgb,var(--gold) 75%,var(--line))}
.pip.s3{background:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
@media (max-width:500px){.panel{padding:16px}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.panel h2{font-size:clamp(24px,3.2vw,32px);margin:4px 0 10px}
.lede{max-width:68ch;color:var(--ink)}
.how{margin:14px 0 6px;padding:0;list-style:none;display:grid;gap:8px;max-width:70ch}
.how li{padding-left:22px;position:relative}
.how li::before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.sec-h{font-family:var(--display);font-size:18px;margin:22px 0 10px}
.levels{display:grid;gap:8px}
.level{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.level .lv{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.level .nm{font-weight:700}
.level .ds{font-size:13px;color:var(--muted)}
.stars{font-size:16px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.stars .on{color:var(--gold)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lvl-r{display:flex;gap:10px;align-items:center}
@media (max-width:540px){.level{grid-template-columns:1fr auto}.level .lv{grid-column:1/-1}}
.field{display:grid;gap:6px}
.field label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px}
.field input{margin-top:4px;accent-color:var(--accent)}
details.ref{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.ref summary{cursor:pointer;font-weight:700;color:var(--accent)}
.tbl-wrap{overflow-x:auto;margin-top:10px}
.reftbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;font-size:14px}
.reftbl div{background:var(--chip);border-radius:6px;padding:4px 8px}
.reftbl b{font-family:var(--mono);margin-right:6px;color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
/* play */
.playbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{background:none;border:none;color:var(--accent);font-weight:700;padding:0}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stage{display:grid;gap:16px;justify-items:start}
.big{font-family:var(--display);font-size:clamp(30px,6vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.q{font-size:20px;font-weight:700}
.hint{font-size:14px;color:var(--muted);max-width:62ch}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.pair .tag{background:var(--chip);border-radius:8px;padding:4px 12px}
.pair .tag.peg{background:var(--accent);color:var(--accent-ink)}
.pair .x{color:var(--muted)}
input[type=text],select{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:min(340px,100%)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700}
.choice:hover{border-color:var(--accent)}
.choice.good{background:var(--good-bg);border-color:var(--good)}
.choice.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{font-weight:700;padding:8px 12px;border-radius:8px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.recall{display:grid;gap:8px;width:100%;max-width:560px}
.recall .r{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center}
.recall .r .k{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:right}
.recall .r input{width:100%}
.recall .r .ok{font-weight:700;font-size:14px;white-space:nowrap}
.ok.g{color:var(--good)} .ok.b{color:var(--bad)}
.grid-obs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;width:100%}
.obj{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:var(--bg);color:var(--ink)}
.obj .e{font-size:34px;line-height:1.1;display:block}
.obj .l{font-size:12px;color:var(--muted)}
button.obj.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
button.obj.good{border-color:var(--good);background:var(--good-bg)}
button.obj.bad{border-color:var(--bad);background:var(--bad-bg)}
button.obj.miss{border-style:dashed;border-color:var(--good)}
.timer{font-family:var(--mono);font-size:14px;color:var(--muted)}
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:88px;border-radius:8px;border:1.5px solid #9AA0B4;background:#FBFBFD;color:#1A1A22;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.pc small{font-size:22px}
.pc.red{color:#C0262D}
.pc.lg{width:110px;height:150px;font-size:40px}
.pc.lg small{font-size:38px}
.deck{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;width:100%}
.deck button{padding:6px 0;border-radius:6px;border:1.5px solid var(--line);background:#FBFBFD;color:#1A1A22;font-weight:800;font-size:13px;font-family:var(--mono)}
.deck button.red{color:#C0262D}
.deck button.sel{box-shadow:0 0 0 3px var(--accent)}
.deck button.good{box-shadow:0 0 0 3px var(--good)}
.deck button.bad{box-shadow:0 0 0 3px var(--bad)}
.deck button.miss{box-shadow:0 0 0 3px var(--gold)}
@media (max-width:560px){.deck{grid-template-columns:repeat(7,minmax(0,1fr))}}
.cards-row{display:flex;flex-wrap:wrap;gap:6px}
.numshow{font-family:var(--mono);font-size:clamp(22px,4.5vw,34px);font-weight:700;letter-spacing:.04em;word-break:break-word}
.items{display:grid;gap:10px;width:100%}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.item .lab{font-weight:700}
.pegline{font-size:14px;color:var(--muted);margin-top:4px}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;width:100%}
.facecard{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;justify-items:center;min-width:0}
.facecard svg{width:130px;height:auto;max-width:100%}
.facecard input,.facecard select{width:100%}
.facecard .ok{font-size:13px;text-align:center}
.seq{display:grid;gap:6px;width:100%;max-width:640px}
.seq button{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px}
.seq button:disabled{opacity:.35}
.picked{display:grid;gap:4px;width:100%;max-width:640px;counter-reset:p}
.picked div{padding:6px 10px;border-radius:6px;background:var(--chip);font-size:14px}
.picked div.g{background:var(--good-bg)} .picked div.b{background:var(--bad-bg)}
.para{max-width:66ch;border-left:3px solid var(--line);padding-left:12px}
.result{display:grid;gap:10px;justify-items:start}
.result .pct{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.result .stars{font-size:34px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:5}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Super-Power Memory Gym</h1>
      <p>One tip at a time, one level at a time. Drills built from the systems in Harry Lorayne’s <i>How to Develop a Super-Power Memory</i>.</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sRank">Untrained</b><span>Rank</span></div>
      <div class="stat"><b id="sXP">0</b><span>XP</span></div>
      <div class="stat"><b id="sStars">0</b><span>Stars</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
    </div>
  </header>
  <div class="app">
    <nav class="map" aria-label="Skills">
      <div class="map-h"><span>Training path</span><label><input type="checkbox" id="unlockAll"> Unlock all</label></div>
      <div id="mapList" class="map"></div>
    </nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function fuzzy(input,answers){const x=norm(input);if(!x)return false;return answers.some(a=>{const y=norm(a);if(!y)return false;if(x===y||x+"s"===y||y+"s"===x||x+"es"===y||y+"es"===x)return true;return y.length>=5&&lev(x,y)<=1})}
const digits=s=>String(s).replace(/\D/g,"");
const pegAns=n=>[PEGS[n],...(PEG_ALT[n]||[])];
function pegFor(pair){if(pair.length===1)return PEGS[+pair];if(pair[0]==="0")return ZERO_PEGS[pair];return PEGS[+pair]}
function pegChunks(num){const d=digits(num),out=[];for(let i=0;i<d.length;i+=2)out.push(d.slice(i,i+2));return out}
const isRed=c=>/[HD]$/.test(c);
const cardLabel=c=>c.slice(0,-1)+SUITS[c.slice(-1)];
const cardHTML=(c,lg)=>`<span class="pc ${isRed(c)?"red":""} ${lg?"lg":""}" aria-label="${esc(cardName(c))}">${c.slice(0,-1)}<small>${SUITS[c.slice(-1)]}</small></span>`;
function cardName(c){const r={A:"Ace",J:"Jack",Q:"Queen",K:"King"}[c.slice(0,-1)]||c.slice(0,-1);return r+" of "+{C:"Clubs",H:"Hearts",S:"Spades",D:"Diamonds"}[c.slice(-1)]}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
function yearKey(y){const sun1=(new Date(y,2,1).getDay()+1)%7;return((sun1-4-1)%7+7)%7}
function dayCalc(y,m,d){const yk=yearKey(y),mk=MONTH_KEYS[m];let t=(yk+mk+d)%7;if(isLeap(y)&&m<2)t=(t+6)%7;return{yk,mk,t}}

/* ---------- scoring & state ---------- */
const lid=(s,j)=>s.id+"-"+j;
const starsOf=sc=>sc>=1?3:sc>=.9?2:sc>=.8?1:0;
const passed=(s,j)=>(P.levels[lid(s,j)]?.stars||0)>0;
function skillDone(s){return s.levels.length?s.levels.every((_,j)=>passed(s,j)):s.field.every((_,k)=>P.field[s.id+"-"+k])}
function skillOpen(i){return P.unlockAll||i===0||skillDone(SKILLS[i-1])}
function levelOpen(s,j){return P.unlockAll||j===0||passed(s,j-1)}
function totals(){let xp=0,stars=0;for(const k in P.levels){xp+=P.levels[k].xp||0;stars+=P.levels[k].stars||0}xp+=Object.values(P.field).filter(Boolean).length*25;return{xp,stars}}
function streak(){const set=new Set(P.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(set.has(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
const RANKS_T=[[0,"Untrained"],[6,"Linker"],[20,"Peg Builder"],[40,"Card Sharp"],[65,"Calendar Whiz"],[95,"Name Master"],[125,"Super-Power"]];
function renderStats(){const t=totals();$("#sXP").textContent=t.xp;$("#sStars").textContent=t.stars;$("#sStreak").textContent=streak();let r="Untrained";for(const[n,name]of RANKS_T)if(t.stars>=n)r=name;$("#sRank").textContent=r}
const starStr=n=>`<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>`<span class="${i<=n?"on":""}">★</span>`).join("")}</span>`;

/* ---------- map & skill view ---------- */
let current=0;
function renderMap(){
  $("#mapList").innerHTML=SKILLS.map((s,i)=>{const open=skillOpen(i);const pips=(s.levels.length?s.levels.map((_,j)=>P.levels[lid(s,j)]?.stars||0):s.field.map((_,k)=>P.field[s.id+"-"+k]?3:0)).map(n=>`<span class="pip s${n}"></span>`).join("");
  return `<button class="skill ${i===current?"on":""} ${open?"":"locked"} ${skillDone(s)?"done":""}" data-i="${i}" ${open?"":'aria-disabled="true"'}><span class="n">${skillDone(s)?"✓":i+1}</span><span><span class="t">${esc(s.name)}</span><span class="c">${open?esc(s.ch):"Finish “"+esc(SKILLS[i-1].name)+"” to unlock"}</span><span class="pips">${pips}</span></span></button>`}).join("");
  document.querySelectorAll(".skill").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!skillOpen(i)){toast("Finish the previous tip first, or tick Unlock all");return}current=i;renderMap();renderSkill();if(innerWidth<860)$("#panel").scrollIntoView({behavior:"smooth"})});
  $("#unlockAll").checked=!!P.unlockAll;renderStats();
}
$("#unlockAll").onchange=e=>{P.unlockAll=e.target.checked;save();renderMap();renderSkill()};

  if(kind==="cards")return `<div class="reftbl">${DECK.map(c=>`<div><b class="${isRed(c)?"":""}">${cardLabel(c)}</b>${CARD_WORDS[c]}</div>`).join("")}</div>`;

}
function renderSkill(){

  ${s.levels.length?`<h3 class="sec-h">Levels</h3><div class="levels">${s.levels.map((L,j)=>{const r=P.levels[lid(s,j)],open=levelOpen(s,j);return `<div class="level"><span class="lv">LEVEL ${j+1}</span><div style="min-width:0"><div class="nm">${esc(L.name)}</div><div class="ds">${esc(L.desc)}${r?` · best ${Math.round(r.best*100)}%`:""}</div></div><div class="lvl-r">${starStr(r?.stars||0)}<button class="btn ${r?"ghost":""}" data-j="${j}" ${open?"":"disabled"} aria-label="${open?"Play":"Locked"} level ${j+1}">${open?(r?"Replay":"Play"):"Locked"}</button></div></div>`}).join("")}</div><p class="note">Score 80% to pass and unlock the next level. 90% earns two stars, a perfect run earns three.</p>`:""}

function logDay(){const t=today();if(!P.days.includes(t))P.days.push(t);P.days=P.days.slice(-400)}

/* ---------- play shell ---------- */
let cleanup=null;
function play(s,j){
  if(cleanup){cleanup();cleanup=null}
  const L=s.levels[j],p=$("#panel");
  p.innerHTML=`<div class="playbar"><button class="back" id="backBtn">← ${esc(s.name)}</button><span class="eyebrow">Level ${j+1} · ${esc(L.name)}</span></div><div class="prog"><i id="progBar" style="width:0%"></i></div><div class="stage" id="stage"></div>`;
  $("#backBtn").onclick=()=>{if(cleanup){cleanup();cleanup=null}renderSkill()};
  const stage=$("#stage");
  ENGINES[L.type](stage,L.cfg,sc=>finish(s,j,sc));
  p.scrollIntoView({behavior:"smooth",block:"start"});
}
const setProg=f=>{const b=$("#progBar");if(b)b.style.width=Math.round(f*100)+"%"};
function finish(s,j,score){
  if(cleanup){cleanup();cleanup=null}
  score=Math.max(0,Math.min(1,score));
  const k=lid(s,j),old=P.levels[k]||{best:0,stars:0,xp:0},st=starsOf(score);
  const xp=Math.round(score*100)+st*20;
  const gained=Math.max(0,xp-(old.xp||0));
  P.levels[k]={best:Math.max(old.best,score),stars:Math.max(old.stars,st),xp:Math.max(old.xp||0,xp)};
  logDay();save();renderMap();
  const next=j+1<s.levels.length?j+1:null;
  setProg(1);
  $("#stage").innerHTML=`<div class="result"><div class="eyebrow">${st?"Level passed":"Not quite"}</div><div class="pct">${Math.round(score*100)}%</div>${starStr(st)}<p>${st?(gained?`+${gained} XP.`:"No new XP; beat your best to earn more."):"You need 80% to pass. Slow down on the study screen and make each picture more ridiculous."}${st&&next===null?" That’s every level of this tip. Try the field missions next.":""}</p><div class="row"><button class="btn ghost" id="again">Try again</button>${st&&next!==null?`<button class="btn" id="nextLv">Next level →</button>`:""}<button class="btn ghost" id="toSkill">Back to ${esc(s.name)}</button></div></div>`;
  $("#again").onclick=()=>play(s,j);
  $("#toSkill").onclick=()=>renderSkill();
  if($("#nextLv"))$("#nextLv").onclick=()=>play(s,next);
}

/* ---------- study cards (one at a time) ---------- */
function study(el,cards,onDone,opts={}){
  let i=0;
  const draw=()=>{const c=cards[i];setProg(opts.progBase?opts.progBase*(i/cards.length):0);
    el.innerHTML=`<div class="eyebrow">${esc(opts.title||"Study")} · ${i+1} / ${cards.length}</div>${c.html}${c.hint?`<details><summary class="hint" style="cursor:pointer">Need an idea?</summary><p class="hint">${c.hint}</p></details>`:""}<div class="row"><button class="btn ghost" id="prv" ${i?"":"disabled"}>Back</button><button class="btn" id="nxt">${i===cards.length-1?(opts.doneLabel||"Start recall"):"Next"}</button><span class="hint">or press <span class="kbd">Enter</span></span></div><p class="hint">${esc(opts.tip||"See the picture clearly for a second before moving on.")}</p>`;
    $("#prv").onclick=()=>{i--;draw()};$("#nxt").onclick=adv;$("#nxt").focus()};
  const adv=()=>{if(i<cards.length-1){i++;draw()}else{off();onDone()}};

  const off=()=>document.removeEventListener("keydown",key);

/* ---------- flash quiz ---------- */
const GENS={
  phonSounds(){const qs=[];for(const d of shuffle(range(0,9)))qs.push({q:`Which sound is digit <span class="mono">${d}</span>?`,choices:SOUNDS,a:SOUNDS[d],explain:SOUND_AID[d]});for(const d of sample(range(0,9),6))qs.push({q:`The sound <b>${SOUNDS[d].split(",")[0]}</b> stands for…`,choices:range(0,9).map(String),a:String(d),explain:SOUND_AID[d]});return shuffle(qs)},
  phonWords(){return sample(Object.keys(PHON_WORDS),12).map(w=>({q:`Turn <b>${w}</b> into digits`,num:true,a:[PHON_WORDS[w]],explain:`${w} → ${PHON_WORDS[w]}`}))},
  phonPick(){const ws=Object.keys(PHON_WORDS);return sample(ws,10).map(w=>{const opts=shuffle([w,...sample(ws.filter(x=>x!==w&&PHON_WORDS[x]!==PHON_WORDS[w]),3)]);return{q:`Which word spells <span class="mono">${PHON_WORDS[w]}</span>?`,choices:opts,a:w,explain:opts.map(o=>`${o} = ${PHON_WORDS[o]}`).join(" · ")}})},
  phonMix(){return shuffle([...GENS.phonSounds().slice(0,8),...GENS.phonWords().slice(0,6),...GENS.phonPick().slice(0,6)])},
  pegs(c){return sample(range(c.lo,c.hi),Math.min(c.n,c.hi-c.lo+1)).map((n,i)=>i%3===2?{q:`Which number is the peg <b>${esc(PEGS[n])}</b>?`,num:true,a:[String(n)],explain:`${PEGS[n]} = ${n}`}:{q:`Peg word for <span class="mono">${n}</span>?`,a:pegAns(n),explain:`${n} = ${PEGS[n]}`})},
  alpha(){return sample(Object.keys(ALPHA),16).map((L,i)=>i%3===2?{q:`Which letter is <b>${esc(ALPHA[L])}</b>?`,a:[L],explain:`${L} = ${ALPHA[L]}`}:{q:`Alphabet peg for <span class="mono">${L}</span>?`,a:[ALPHA[L],ALPHA[L].split(" ")[0]],explain:`${L} = ${ALPHA[L]}`})},
  cards(){return sample(DECK,16).map((c,i)=>{if(i%3===2){const opts=shuffle([c,...sample(DECK.filter(x=>x!==c),3)]);return{q:`Which card is <b>${CARD_WORDS[c]}</b>?`,cardChoices:opts,a:c,explain:`${CARD_WORDS[c]} = ${cardName(c)}`}}return{q:`Card word for ${cardHTML(c,true)}`,a:[CARD_WORDS[c]],explain:`${cardName(c)} = ${CARD_WORDS[c]}`}})},
  monthKeys(){return shuffle([...range(0,11),...sample(range(0,11),4)]).map(m=>({q:`Month key for <b>${MONTHS[m]}</b>?`,choices:range(0,6).map(String),a:String(MONTH_KEYS[m]),explain:MONTH_AIDS[m]}))},
  apptConvert(){const qs=[];for(let i=0;i<12;i++){const d=rnd(7),h=1+rnd(10),n=(d+1)*10+(h%10);const label=`${WEEK[d]} at ${h}:00`;
    if(i%2===0)qs.push({q:`Peg word for <b>${label}</b>?`,a:[PEGS[n],String(n),...(PEG_ALT[n]||[])],explain:`${WEEK[d]} = ${d+1}, ${h} o’clock = ${h%10} → ${n} = ${PEGS[n]}`});
    else{const opts=new Set([label]);while(opts.size<4){const d2=rnd(7),h2=1+rnd(10);opts.add(`${WEEK[d2]} at ${h2}:00`)}qs.push({q:`Which day and hour is <b>${esc(PEGS[n])}</b>?`,choices:shuffle([...opts]),a:label,explain:`${PEGS[n]} = ${n} → day ${d+1}, hour ${h%10||10}`})}}return qs}
};
function flash(el,cfg,done,qsIn){
  const qs=qsIn||GENS[cfg.gen](cfg);let i=0,right=0,t0=Date.now(),tick=null,over=false;
  const end=()=>{if(over)return;over=true;clearInterval(tick);done(right/qs.length)};
  if(cfg.time){tick=setInterval(()=>{const left=cfg.time-Math.floor((Date.now()-t0)/1000);const tm=$("#tmr");if(tm)tm.textContent=`${Math.max(0,left)}s left`;if(left<=0)end()},250);cleanup=()=>clearInterval(tick)}
  const draw=()=>{if(over)return;setProg(i/qs.length);const q=qs[i];
    el.innerHTML=`<div class="row" style="justify-content:space-between;width:100%"><span class="eyebrow">Question ${i+1} / ${qs.length} · ${right} right</span>${cfg.time?`<span class="timer" id="tmr">${cfg.time}s left</span>`:""}</div><div class="q">${q.q}</div>${
      q.choices?`<div class="choices">${q.choices.map((c,k)=>`<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")}</div>`:
      q.cardChoices?`<div class="choices">${q.cardChoices.map((c,k)=>`<button class="choice" data-k="${k}" style="padding:6px">${cardHTML(c)}</button>`).join("")}</div>`:
      `<form class="row" id="fq"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${q.num?"numeric":"text"}" aria-label="Your answer"><button class="btn">Check</button></form>`}<div id="fb"></div>`;
    const answer=(ok,btn)=>{if(ok)right++;const fb=$("#fb");fb.innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?"Right.":"Not quite."} ${esc(q.explain||"")}</div>${ok&&!cfg.time?"":`<div class="row" style="margin-top:10px"><button class="btn" id="go">Next</button></div>`}`;
      el.querySelectorAll(".choice,#fq button,#ans").forEach(b=>b.disabled=true);
      const go=()=>{i++;i>=qs.length?end():draw()};
      if(ok)setTimeout(go,cfg.time?350:750);else{$("#go").onclick=go;$("#go").focus()}};
    if(q.choices||q.cardChoices){const arr=q.choices||q.cardChoices;el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const v=arr[+b.dataset.k],ok=v===q.a;b.classList.add(ok?"good":"bad");if(!ok)el.querySelectorAll(".choice").forEach(x=>{if(arr[+x.dataset.k]===q.a)x.classList.add("good")});answer(ok)})}
    else{$("#ans").focus();$("#fq").onsubmit=e=>{e.preventDefault();const v=$("#ans").value;if(!v.trim())return;const ok=q.num?q.a.includes(digits(v)):fuzzy(v,q.a);answer(ok)}}
  };draw();
}

/* ---------- engines ---------- */
const ENGINES={

},
recall(el,cfg,done){
  let entries;

    `<div class="big">${esc(e.v)}</div>${i?`<div class="pair"><span class="tag">${esc(entries[i-1].v)}</span><span class="x">⟷</span><span class="tag peg">${esc(e.v)}</span></div><p class="hint">Make one ridiculous picture of these two together.</p>`:`<p class="hint">The first item. Just see it clearly.</p>`}`:
    `<div class="pair"><span class="tag peg">${keyLabel(e.k)} · ${esc(pegWord(e.k))}</span><span class="x">⟷</span><span class="tag">${esc(e.v)}</span></div><div class="big">${esc(e.v)}</div>`,
    hint:cfg.mode==="link"&&i?`Try: a ${esc(entries[i-1].v)} made out of ${esc(e.v)}s, or millions of ${esc(e.v)}s pouring out of a ${esc(entries[i-1].v)}.`:cfg.mode!=="link"?`Try: a giant ${esc(e.v)} where the ${esc(pegWord(e.k))} should be, or the ${esc(pegWord(e.k))} attacking a ${esc(e.v)}.`:""}));

    const inputs=[...el.querySelectorAll("#rf input")];inputs[0].focus();

      $("#chk").outerHTML=`<button class="btn" type="button" id="cont">See result</button>`;$("#cont").onclick=()=>done(ok/entries.length);$("#cont").focus()};

numbers(el,cfg,done){

  const fmt=n=>cfg.kind==="phone"?(n.length===7?n.slice(0,3)+"-"+n.slice(3):`(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}`):pegChunks(n).join(" ");
  const people=sample(HARD_NAMES.map(h=>h[0]),cfg.count),jobs=sample(JOBS,cfg.count);
  const items=range(0,cfg.count-1).map(i=>({label:cfg.kind==="phone"?`${people[i]} the ${jobs[i]}`:`The number`,num:mk(cfg.len)}));
  const pegLine=n=>pegChunks(n).map(p=>`${p} ${pegFor(p)}`).join(" → ");
  setProg(0);
  el.innerHTML=`<div class="q">${cfg.kind==="phone"?"Link each person to the peg words of their number.":"Turn the pairs into peg words and link them."}</div><div class="items">${items.map(it=>`<div class="item"><div class="lab">${esc(it.label)}</div><div class="numshow">${fmt(it.num)}</div><div class="pegline" ${cfg.hints?"":"hidden"}>${esc(pegLine(it.num))}</div></div>`).join("")}</div><div class="row">${cfg.hints?"":`<button class="btn ghost" id="hint">Show peg words</button>`}<button class="btn" id="ready">I’ve got it, hide them</button></div><p class="hint">Take as long as you need. ${cfg.kind==="phone"?"Start each link from a picture of the person’s name or job.":""}</p>`;
  if($("#hint"))$("#hint").onclick=()=>{el.querySelectorAll(".pegline").forEach(x=>x.hidden=false);$("#hint").remove()};
  $("#ready").onclick=()=>{setProg(.5);
    el.innerHTML=`<div class="q">Type the digits back.</div><form class="items" id="nf">${items.map((it,i)=>`<div class="item"><label class="lab" for="n${i}">${esc(it.label)}</label><div class="row" style="margin-top:6px"><input type="text" id="n${i}" inputmode="numeric" autocomplete="off"><span class="ok" id="no${i}"></span></div></div>`).join("")}<div class="row"><button class="btn" id="chk">Check</button></div></form>`;
    $("#n0").focus();
    $("#nf").onsubmit=e=>{e.preventDefault();let ok=0,tot=0;items.forEach((it,i)=>{const g=digits($("#n"+i).value);let c=0;for(let k=0;k<it.num.length;k++)if(g[k]===it.num[k])c++;ok+=c;tot+=it.num.length;$("#n"+i).disabled=true;const o=$("#no"+i);o.className="ok "+(c===it.num.length?"g":"b");o.textContent=c===it.num.length?"✓ perfect":`${c}/${it.num.length} · was ${fmt(it.num)}`});
      $("#chk").outerHTML=`<button class="btn" type="button" id="cont">See result</button>`;$("#cont").onclick=()=>done(ok/tot)}};
},
calendar(el,cfg,done){
  const Y=new Date().getFullYear();
  const dayQ=(y,m,d,showKey)=>{const r=dayCalc(y,m,d);const leap=isLeap(y)&&m<2;
    return{q:`What day of the week is <b>${MONTHS[m]} ${d}, ${y}</b>?${showKey?` <span class="hint">(year key ${r.yk})</span>`:""}`,choices:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],a:DAYS_SUN1[r.t],
      explain:`year ${r.yk} + ${MONTHS[m].slice(0,3)} ${r.mk} + day ${d} = ${r.yk+r.mk+d} → cast out 7s → ${(r.yk+r.mk+d)%7}${leap?" → leap-year Jan/Feb, one day earlier":""} → ${DAYS_SUN1[r.t]}`}};
  const randDate=y=>{const m=rnd(12),dim=new Date(y,m+1,0).getDate();return[y,m,1+rnd(dim)]};
  if(cfg.mode==="thisyear"){
    const code=range(0,11).map(m=>{for(let d=1;d<=7;d++)if(new Date(Y,m,d).getDay()===0)return d}).join("");
    const firstSunQ=(m,d)=>{const fs=+code[m];const t=new Date(Y,m,d).getDay();return{q:`What day of the week is <b>${MONTHS[m]} ${d}, ${Y}</b>?`,choices:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],a:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][t],explain:`First Sunday of ${MONTHS[m]} is the ${fs}th, so the ${fs+7}th, ${fs+14}th and ${fs+21}th are Sundays too.`}};
    study(el,[{html:`<div class="q">The first Sundays of ${Y}, January to December:</div><div class="numshow">${code.match(/.{1,4}/g).join(" ")}</div><div class="pegline">${MONTHS.map((m,i)=>m.slice(0,3)+" "+code[i]).join(" · ")}</div><p class="hint">Make words for the groups of digits and link them, the way the book does with chum, mug, linger, dishmat. Pegs as pairs: ${pegChunks(code).map(p=>p+" "+pegFor(p)).join(" → ")}.</p>`}],()=>flash(el,{},done,range(1,10).map(()=>{const[,m,d]=randDate(Y);return firstSunQ(m,d)})),{title:"Memorise",doneLabel:"Start quiz"});
  } else if(cfg.mode==="full"){
    flash(el,{},done,range(1,10).map(()=>{const[y,m,d]=randDate(1900+rnd(200));return dayQ(y,m,d,true)}));
  } else {
    const years=sample(range(Y-12,Y+12),8).sort();
    study(el,years.map(y=>{const k=yearKey(y),two=String(y).slice(2);return{html:`<div class="big mono">${y}</div><div class="pair"><span class="tag peg">${two} · ${esc(pegFor(two))}</span><span class="x">⟷</span><span class="tag">key ${k}${k?" · "+SHAPES[k]:" · zoo"}</span></div>${isLeap(y)?`<p class="hint">Leap year: January and February come out one day earlier.</p>`:""}`,hint:`Link the year’s peg (${esc(pegFor(two))}) to a picture for the key. The book suggests a short spare list such as the shape pegs (1 pencil, 2 swan…) with “zoo” for 0.`}}),
      ()=>flash(el,{},done,range(1,10).map(()=>{const[y,m,d]=randDate(years[rnd(8)]);return dayQ(y,m,d,false)})),{title:"Year keys",doneLabel:"Start quiz"});
  }
},
vocab(el,cfg,done){
  const set=shuffle(VOCAB[cfg.set]);
  study(el,set.map(([w,m,s])=>({html:`<div class="big">${esc(w)}</div><div class="q" style="color:var(--muted)">${esc(m)}</div><label class="hint" for="own">Your own substitute picture (optional):</label><input type="text" id="own" autocomplete="off" placeholder="e.g. a fish drinking poison">`,hint:esc(s)})),()=>{
    const qs=[];set.forEach(([w,m])=>{const others=sample(set.filter(x=>x[0]!==w),3);qs.push({q:`What does <b>${esc(w)}</b> mean?`,choices:shuffle([m,...others.map(o=>o[1])]),a:m,explain:`${w} = ${m}`})});
    if(cfg.both)sample(set,5).forEach(([w,m])=>{const others=sample(set.filter(x=>x[0]!==w),3);qs.push({q:`Which word means <b>${esc(m)}</b>?`,choices:shuffle([w,...others.map(o=>o[0])]),a:w,explain:`${m} = ${w}`})});
    flash(el,{},done,shuffle(qs))},{title:"Learn",doneLabel:"Start quiz",tip:"Say the word aloud, find the sound-alike, then link it to the meaning."});
},
faces(el,cfg,done){
  const feats=sample(FEATURES,cfg.n);let ppl;
  if(cfg.set==="easy")ppl=sample(EASY_NAMES,cfg.n).map(([n,s])=>({name:n,ans:[n,n.split(" ")[1]],sub:s}));
  else if(cfg.set==="hard")ppl=sample(HARD_NAMES,cfg.n).map(([n,s])=>({name:n,ans:[n],sub:s}));
  else{const hn=sample(HARD_NAMES,cfg.n),fn=sample(FIRST,cfg.n),jb=sample(JOBS,cfg.n),ct=sample(CITIES,cfg.n);ppl=hn.map(([n,s],i)=>({name:fn[i]+" "+n,ans:[n],first:fn[i],sub:s,job:jb[i],city:ct[i]}))}
  ppl.forEach((p,i)=>{p.feat=feats[i];p.svg=faceSVG(p.feat)});
  study(el,ppl.map(p=>({html:`<div class="facecard" style="justify-items:start;border:none;padding:0">${p.svg}</div><div class="big">${esc(p.name)}</div>${p.job?`<div class="q">${esc(p.job)} from ${esc(p.city)}</div>`:""}`,hint:`Outstanding feature: <b>${esc(p.feat)}</b>. Substitute for ${esc(p.name.split(" ").pop())}: ${esc(p.sub)}. Link the two${p.job?`, and add the ${esc(p.job)} and ${esc(p.city)} to the picture`:""}.`})),recall,{title:"Meet them",progBase:.5,tip:"Say the name, find the outstanding feature, and link the name picture to it."});
  function recall(){setProg(.5);const order=shuffle(range(0,ppl.length-1));
    el.innerHTML=`<div class="q">Who’s who? Type each surname.</div><form id="ff" style="width:100%;display:grid;gap:14px"><div class="faces">${order.map((pi,r)=>{const p=ppl[pi];return `<div class="facecard">${p.svg}<input type="text" id="fn${r}" placeholder="Surname" autocomplete="off" spellcheck="false" aria-label="Name for face ${r+1}">${p.job?`<select id="fj${r}" aria-label="Job"><option value="">Job…</option>${[...new Set(ppl.map(x=>x.job))].sort().map(j=>`<option>${j}</option>`).join("")}</select><select id="fc${r}" aria-label="City"><option value="">City…</option>${[...new Set(ppl.map(x=>x.city))].sort().map(c=>`<option>${c}</option>`).join("")}</select>`:""}<div class="ok" id="fo${r}"></div></div>`}).join("")}</div><div class="row"><button class="btn" id="chk">Check</button></div></form>`;
    $("#fn0").focus();
    $("#ff").onsubmit=e=>{e.preventDefault();let ok=0,tot=0;order.forEach((pi,r)=>{const p=ppl[pi];const n=fuzzy($("#fn"+r).value,p.ans);ok+=n;tot++;let msg=n?"✓ "+p.name:"✗ "+p.name;
      if(p.job){const j=$("#fj"+r).value===p.job,c=$("#fc"+r).value===p.city;ok+=j+c;tot+=2;msg+=` · ${j?"✓":"✗"} ${p.job} · ${c?"✓":"✗"} ${p.city}`;$("#fj"+r).disabled=$("#fc"+r).disabled=true}
      $("#fn"+r).disabled=true;const o=$("#fo"+r);o.className="ok "+(msg.includes("✗")?"b":"g");o.textContent=msg});
      $("#chk").outerHTML=`<button class="btn" type="button" id="cont">See result</button>`;$("#cont").onclick=()=>done(ok/tot)}}
},
appt(el,cfg,done){
  const tasks=sample(TASKS,cfg.n),used=new Set();
  const ap=tasks.map(t=>{let d,h,n;do{d=rnd(7);h=1+rnd(10);n=(d+1)*10+(h%10)}while(used.has(n));used.add(n);return{t,d,h,n,label:`${WEEK[d]} at ${h}:00`}});
  study(el,ap.map(a=>({html:`<div class="big">${esc(a.t)}</div><div class="q">${a.label}</div><div class="pair"><span class="tag peg">${a.n} · ${esc(PEGS[a.n])}</span><span class="x">⟷</span><span class="tag">${esc(a.t)}</span></div>`,hint:`${WEEK[a.d]} is day ${a.d+1}, ${a.h} o’clock is ${a.h%10}: ${a.n} = ${esc(PEGS[a.n])}. Picture the ${esc(PEGS[a.n])} taking part in “${esc(a.t.toLowerCase())}”.`})),()=>{
    flash(el,{},done,shuffle(ap).map(a=>{const opts=new Set([a.label]);ap.forEach(x=>opts.size<4&&opts.add(x.label));while(opts.size<4)opts.add(`${WEEK[rnd(7)]} at ${1+rnd(10)}:00`);return{q:`When is <b>${esc(a.t)}</b>?`,choices:shuffle([...opts]),a:a.label,explain:`${a.label} = ${a.n} = ${PEGS[a.n]}`}}))},{title:"This week",doneLabel:"Start quiz",progBase:.5});
},
order(el,cfg,done){
  const ideas=SPEECH.slice(0,cfg.n);setProg(0);
  el.innerHTML=`<div class="q">“A rooftop garden for the library”: read the talk, give each thought a key word, and link the key words.</div>${ideas.map((x,i)=>`<div class="para"><p style="margin:0 0 6px">${esc(x[1])}</p><input type="text" id="kw${i}" placeholder="Your key word" autocomplete="off" aria-label="Key word for thought ${i+1}"></div>`).join("")}<p class="hint">Example: roof → vegetables → students… Picture a roof sprouting giant vegetables, and students climbing out of the vegetables.</p><button class="btn" id="ready">I’ve linked it, test me</button>`;
  $("#ready").onclick=()=>{const kws=ideas.map((_,i)=>$("#kw"+i).value.trim());const pool=shuffle(range(0,cfg.n-1)),picked=[];setProg(.5);
    const draw=()=>{el.innerHTML=`<div class="q">Tap the thoughts in the order of the talk.</div><div class="picked">${picked.map((k,i)=>`<div>${i+1}. ${esc(ideas[k][0])}</div>`).join("")||`<div class="hint">Nothing yet</div>`}</div><div class="seq">${pool.map(k=>`<button data-k="${k}" ${picked.includes(k)?"disabled":""}>${esc(ideas[k][0])}</button>`).join("")}</div><div class="row"><button class="btn ghost" id="undo" ${picked.length?"":"disabled"}>Undo</button><button class="btn" id="chk" ${picked.length===cfg.n?"":"disabled"}>Check order</button></div>`;
      el.querySelectorAll(".seq button").forEach(b=>b.onclick=()=>{picked.push(+b.dataset.k);draw()});
      $("#undo").onclick=()=>{picked.pop();draw()};
      $("#chk").onclick=()=>{let ok=0;const rows=[...el.querySelectorAll(".picked div")];picked.forEach((k,i)=>{const g=k===i;ok+=g;rows[i].className=g?"g":"b";rows[i].textContent=`${i+1}. ${ideas[k][0]}${g?" ✓":` ✗ (should be: ${ideas[i][0]}${kws[i]?", your key word “"+kws[i]+"”":""})`}`});
        el.querySelector(".seq").remove();$("#undo").remove();$("#chk").outerHTML=`<button class="btn" id="cont">See result</button>`;$("#cont").onclick=()=>done(ok/cfg.n)}};draw()};
}
};

/* ---------- face drawing ---------- */
function faceSVG(feat){
  const skins=["#F3D5B5","#E4B48A","#C98D5A","#9A6338","#6B4426","#F7E1CB"],hairs=["#2A1B10","#6B3E1F","#C9A15A","#8E8E8E","#A9442C","#151515"],shirts=["#4E6BD8","#2E9C78","#C2504A","#8A55C4","#D59A2B","#3D4A5C"];
  const o={skin:skins[rnd(6)],hairC:hairs[rnd(6)],shirt:shirts[rnd(6)],rx:28+rnd(5),ry:35+rnd(5),hair:["short","side","curly","long"][rnd(4)],brows:"thin",nose:"small",ears:"normal",eyes:"normal",mouth:["smile","flat"][rnd(2)]};
  const f={"huge nose":()=>o.nose="huge","big ears":()=>{o.ears="big";o.hair="short"},"bushy eyebrows":()=>o.brows="bushy","mole on the cheek":()=>o.mole=1,"round glasses":()=>o.glasses=1,"thick beard":()=>o.beard=1,"high forehead":()=>{o.forehead=1;o.hair="short"},"curly hair":()=>o.hair="curly","tiny eyes":()=>o.eyes="tiny","wide grin":()=>o.mouth="grin","big mustache":()=>o.mustache=1,"hoop earrings":()=>{o.earrings=1;o.hair="long"},"freckles":()=>o.freckles=1,"spiky hair":()=>o.hair="spiky","long hair":()=>o.hair="long","hair bun":()=>o.hair="bun","bald head":()=>o.hair="bald","cleft chin":()=>o.cleft=1};
  f[feat]&&f[feat]();
  const cx=60,cy=72,{rx,ry}=o,S=`stroke="#2A2633" stroke-width="1.6"`,top=cy-ry,hl=o.forehead?top+4:top+14;
  let back="",front="";
  if(o.hair==="long")back=`<path d="M${cx-rx-5} ${cy-4} Q${cx-rx-8} ${cy+44} ${cx-rx+4} ${cy+48} L${cx+rx-4} ${cy+48} Q${cx+rx+8} ${cy+44} ${cx+rx+5} ${cy-4} Z" fill="${o.hairC}"/>`;
  if(o.hair==="bun")back=`<circle cx="${cx}" cy="${top-6}" r="13" fill="${o.hairC}" ${S}/>`;
  if(["short","long","bun","side"].includes(o.hair))front=`<path d="M${cx-rx-1} ${cy-2} Q${cx-rx-2} ${top-6} ${cx} ${top-5} Q${cx+rx+2} ${top-6} ${cx+rx+1} ${cy-2} Q${cx+rx-4} ${hl} ${o.hair==="side"?cx-6:cx} ${hl} Q${cx-rx+4} ${hl} ${cx-rx-1} ${cy-2} Z" fill="${o.hairC}"/>`;
  if(o.hair==="curly")front=range(0,8).map(k=>{const a=Math.PI*(1.05+k*0.1125);return `<circle cx="${cx+Math.cos(a)*(rx+1)}" cy="${cy-6+Math.sin(a)*(ry+1)}" r="9" fill="${o.hairC}"/>`}).join("");
  if(o.hair==="spiky")front=`<path d="M${cx-rx} ${cy-6} L${cx-rx+2} ${top-10} L${cx-16} ${top+2} L${cx-10} ${top-16} L${cx-2} ${top} L${cx+6} ${top-17} L${cx+12} ${top+1} L${cx+20} ${top-12} L${cx+rx-2} ${top+4} L${cx+rx} ${cy-6} Q${cx} ${top+14} ${cx-rx} ${cy-6} Z" fill="${o.hairC}"/>`;
  if(o.hair==="bald")front=`<path d="M${cx-rx} ${cy-2} q-2 -10 3 -16 M${cx+rx} ${cy-2} q2 -10 -3 -16" stroke="${o.hairC}" stroke-width="5" fill="none"/><path d="M${cx-10} ${top+8} q8 -4 16 0" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none"/>`;
  const er=o.ears==="big"?[11,15]:[6,9];
  const brow=o.brows==="bushy"?`stroke="${o.hairC}" stroke-width="5.5" stroke-linecap="round"`:`stroke="${o.hairC}" stroke-width="2.2" stroke-linecap="round"`;
  const eyeR=o.eyes==="tiny"?1.6:3.2;
  const nose=o.nose==="huge"?`<path d="M${cx-1} ${cy-2} Q${cx-16} ${cy+20} ${cx-4} ${cy+21} Q${cx+8} ${cy+22} ${cx+5} ${cy+14}" fill="${o.skin}" ${S}/>`:`<path d="M${cx} ${cy+1} q-5 9 1 10" fill="none" ${S}/>`;
  const mouthY=cy+(o.nose==="huge"?25:20);
  const mouth=o.mouth==="grin"?`<path d="M${cx-14} ${mouthY-2} Q${cx} ${mouthY+16} ${cx+14} ${mouthY-2} Z" fill="#fff" ${S}/>`:o.mouth==="smile"?`<path d="M${cx-9} ${mouthY} q9 7 18 0" fill="none" ${S}/>`:`<path d="M${cx-8} ${mouthY+2} h16" ${S}/>`;
  return `<svg viewBox="0 0 120 140" role="img" aria-label="A face"><rect width="120" height="140" rx="12" fill="#E4E8F0"/>${back}<path d="M12 140 Q18 112 60 110 Q102 112 108 140 Z" fill="${o.shirt}"/><rect x="52" y="${cy+ry-8}" width="16" height="16" fill="${o.skin}"/>
  <ellipse cx="${cx-rx+1}" cy="${cy+2}" rx="${er[0]}" ry="${er[1]}" fill="${o.skin}" ${S}/><ellipse cx="${cx+rx-1}" cy="${cy+2}" rx="${er[0]}" ry="${er[1]}" fill="${o.skin}" ${S}/>
  ${o.earrings?`<circle cx="${cx-rx}" cy="${cy+16}" r="5" fill="none" stroke="#D4A017" stroke-width="2.2"/><circle cx="${cx+rx}" cy="${cy+16}" r="5" fill="none" stroke="#D4A017" stroke-width="2.2"/>`:""}
  <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${o.skin}" ${S}/>
  ${o.beard?`<path d="M${cx-rx+1} ${cy+2} Q${cx-rx+4} ${cy+ry+10} ${cx} ${cy+ry+12} Q${cx+rx-4} ${cy+ry+10} ${cx+rx-1} ${cy+2} Q${cx+8} ${cy+14} ${cx} ${cy+16} Q${cx-8} ${cy+14} ${cx-rx+1} ${cy+2} Z" fill="${o.hairC}"/>`:""}
  ${front}
  <path d="M${cx-17} ${cy-11} q6 -4 12 0 M${cx+5} ${cy-11} q6 -4 12 0" fill="none" ${brow}/>
  <circle cx="${cx-11}" cy="${cy-3}" r="${eyeR}" fill="#1E1A24"/><circle cx="${cx+11}" cy="${cy-3}" r="${eyeR}" fill="#1E1A24"/>
  ${o.glasses?`<circle cx="${cx-11}" cy="${cy-3}" r="9" fill="none" stroke="#1E1A24" stroke-width="2.4"/><circle cx="${cx+11}" cy="${cy-3}" r="9" fill="none" stroke="#1E1A24" stroke-width="2.4"/><path d="M${cx-2} ${cy-4} h4" stroke="#1E1A24" stroke-width="2.4"/>`:""}
  ${nose}
  ${o.mustache?`<path d="M${cx-17} ${cy+20} Q${cx-8} ${cy+11} ${cx} ${cy+15} Q${cx+8} ${cy+11} ${cx+17} ${cy+20} Q${cx+8} ${cy+17} ${cx} ${cy+19} Q${cx-8} ${cy+17} ${cx-17} ${cy+20} Z" fill="${o.hairC}"/>`:""}
  ${o.beard&&o.mouth!=="grin"?`<path d="M${cx-8} ${mouthY+1} q8 6 16 0" fill="none" stroke="#F0E6E0" stroke-width="2"/>`:mouth}
  ${o.mole?`<circle cx="${cx+15}" cy="${cy+11}" r="2.6" fill="#3A2A20"/>`:""}
  ${o.freckles?[[-16,8],[-12,11],[-19,12],[16,8],[12,11],[19,12]].map(([x,y])=>`<circle cx="${cx+x}" cy="${cy+y}" r="1.1" fill="#9A5A32"/>`).join(""):""}
  ${o.cleft?`<path d="M${cx} ${cy+ry-7} v5" ${S}/>`:""}
  </svg>`;
}

(function start(){const firstOpen=SKILLS.findIndex((s,i)=>skillOpen(i)&&!skillDone(s));current=firstOpen<0?0:firstOpen;renderMap();renderSkill()})();
